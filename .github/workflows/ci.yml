name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Privacy scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Scan for private/local/deprecated identifiers
        run: python3 scripts/ci_privacy_scan.py

  skill-gates:
    name: Skill package gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install skills-ref (Agent Skills validator)
        run: python3 -m pip install --quiet skills-ref
      - name: Install render toolchain (visual fill gate)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-impress poppler-utils fonts-noto-cjk
          python3 -m pip install --quiet pillow numpy
      - name: Skill gates (validator + audits + negatives + PPTX smoke)
        run: bash scripts/ci_skill_gates.sh --with-pptx
      - name: Upload pixel diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-diff
          path: tests/pixel/_diff/
          if-no-files-found: ignore
